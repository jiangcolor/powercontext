<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实验记录 - 实验记录本</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"/>
      </svg>
      实验记录本
    </a>
    <nav>
      <a href="index.html">首页</a>
      <a href="experiments.html" class="active">实验记录</a>
      <a href="search.html">语义搜索</a>
      <a href="projects.html">项目管理</a>
      <a href="compare.html">实验对比</a>
    </nav>
  </header>

  <main class="container">
    <div class="form-card">
      <h2>添加实验记录</h2>
      <form id="experiment-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="project_id">所属项目 *</label>
            <input type="text" id="project_id" placeholder="如：image-classification" required>
          </div>
          <div class="form-group">
            <label for="title">实验标题 *</label>
            <input type="text" id="title" placeholder="如：ResNet50 baseline with data augmentation" required>
          </div>
          <div class="form-group">
            <label for="status">实验状态</label>
            <select id="status">
              <option value="success">成功</option>
              <option value="failed">失败</option>
              <option value="inconclusive">不确定</option>
            </select>
          </div>
          <div class="form-group">
            <label for="tags">标签（逗号分隔）</label>
            <input type="text" id="tags" placeholder="如：cnn,baseline,augmentation">
          </div>
          <div class="form-group full-width">
            <label for="parameters">实验参数（JSON 格式）</label>
            <textarea id="parameters" placeholder='{"learning_rate": 0.001, "batch_size": 32, "epochs": 50, "model": "ResNet50"}' style="min-height: 80px; font-family: monospace;"></textarea>
          </div>
          <div class="form-group full-width">
            <label for="metrics">实验指标（JSON 格式）</label>
            <textarea id="metrics" placeholder='{"accuracy": 0.923, "loss": 0.156, "f1_score": 0.91}' style="min-height: 80px; font-family: monospace;"></textarea>
          </div>
          <div class="form-group full-width">
            <label for="notes">实验笔记</label>
            <textarea id="notes" placeholder="记录实验过程、观察到的现象、可能的改进方向..."></textarea>
          </div>
        </div>
        <div style="margin-top: 1.5rem; display: flex; gap: 0.75rem;">
          <button type="submit" class="btn btn-primary">保存实验记录</button>
          <button type="reset" class="btn btn-secondary">清空</button>
        </div>
      </form>
    </div>

    <div class="section-header">
      <h2>实验历史</h2>
      <select id="filter-project" class="btn btn-secondary" style="font-size: 0.85rem;">
        <option value="">全部项目</option>
      </select>
    </div>

    <div id="experiment-list" class="experiment-list">
      <div class="loading"><div class="spinner"></div>加载中...</div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById('experiment-form');
    const listEl = document.getElementById('experiment-list');
    const filterEl = document.getElementById('filter-project');
    let allExperiments = [];

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const paramsRaw = document.getElementById('parameters').value.trim();
      const metricsRaw = document.getElementById('metrics').value.trim();
      let parameters = {}, metrics = {};
      try {
        if (paramsRaw) parameters = JSON.parse(paramsRaw);
        if (metricsRaw) metrics = JSON.parse(metricsRaw);
      } catch {
        showToast('参数或指标 JSON 格式错误', 'error');
        return;
      }
      const tagsRaw = document.getElementById('tags').value.trim();
      const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];

      const body = {
        project_id: document.getElementById('project_id').value.trim(),
        title: document.getElementById('title').value.trim(),
        parameters,
        metrics,
        notes: document.getElementById('notes').value.trim(),
        tags,
        status: document.getElementById('status').value,
      };

      try {
        await api('/experiments', { method: 'POST', body: JSON.stringify(body) });
        showToast('实验记录已保存', 'success');
        form.reset();
        loadExperiments();
      } catch (e) {
        showToast('保存失败: ' + e.message, 'error');
      }
    });

    async function loadExperiments() {
      try {
        const projectId = filterEl.value;
        const url = projectId ? `/experiments?project_id=${encodeURIComponent(projectId)}` : '/experiments';
        allExperiments = await api(url);
        renderList(allExperiments);
        updateProjectFilter(allExperiments);
      } catch {
        listEl.innerHTML = '<div class="empty-state"><h3>暂无实验记录</h3><p>在上方表单中添加你的第一条实验记录</p></div>';
      }
    }

    function renderList(experiments) {
      if (!experiments || experiments.length === 0) {
        listEl.innerHTML = '<div class="empty-state"><h3>暂无实验记录</h3><p>在上方表单中添加你的第一条实验记录</p></div>';
        return;
      }
      listEl.innerHTML = experiments.map(exp => renderExperimentCard(exp)).join('');
    }

    function updateProjectFilter(experiments) {
      const projects = new Set(experiments.map(e => e.project_id).filter(Boolean));
      const current = filterEl.value;
      const options = ['<option value="">全部项目</option>'];
      projects.forEach(p => {
        options.push(`<option value="${p}" ${p === current ? 'selected' : ''}>${p}</option>`);
      });
      filterEl.innerHTML = options.join('');
    }

    filterEl.addEventListener('change', loadExperiments);
    loadExperiments();
  </script>
</body>
</html>
