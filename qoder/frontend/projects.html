<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目管理 - 实验记录本</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"/>
      </svg>
      实验记录本
    </a>
    <nav>
      <a href="index.html">首页</a>
      <a href="experiments.html">实验记录</a>
      <a href="search.html">语义搜索</a>
      <a href="projects.html" class="active">项目管理</a>
      <a href="compare.html">实验对比</a>
    </nav>
  </header>

  <main class="container">
    <div class="form-card">
      <h2>创建科研项目</h2>
      <p style="color: var(--text-light); font-size: 0.9rem; margin-bottom: 1.5rem;">
        项目信息会存储在 PowerContext 中，跨会话持久化，下次打开仍然记得。
      </p>
      <form id="project-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="name">项目名称 *</label>
            <input type="text" id="name" placeholder="如：image-classification" required>
          </div>
          <div class="form-group">
            <label for="goal">研究目标</label>
            <input type="text" id="goal" placeholder="如：提升 ImageNet 分类准确率至 95%">
          </div>
          <div class="form-group full-width">
            <label for="description">项目描述</label>
            <textarea id="description" placeholder="描述项目的背景、范围和关键约束..." style="min-height: 80px;"></textarea>
          </div>
        </div>
        <div style="margin-top: 1.5rem;">
          <button type="submit" class="btn btn-primary">创建项目</button>
        </div>
      </form>
    </div>

    <div class="form-card">
      <h2>更新项目状态</h2>
      <form id="update-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="update-name">项目名称 *</label>
            <input type="text" id="update-name" placeholder="要更新的项目名称" required>
          </div>
          <div class="form-group">
            <label for="update-status">新状态</label>
            <select id="update-status">
              <option value="active">进行中</option>
              <option value="paused">暂停</option>
              <option value="completed">已完成</option>
            </select>
          </div>
          <div class="form-group full-width">
            <label for="update-notes">进展备注</label>
            <textarea id="update-notes" placeholder="记录项目最新进展、关键决策或待办事项..." style="min-height: 60px;"></textarea>
          </div>
        </div>
        <div style="margin-top: 1.5rem;">
          <button type="submit" class="btn btn-primary">更新状态</button>
        </div>
      </form>
    </div>

    <div class="section-header">
      <h2>项目列表</h2>
      <button class="btn btn-secondary btn-sm" onclick="loadProjects()">刷新</button>
    </div>

    <div id="project-list" class="project-grid">
      <div class="loading"><div class="spinner"></div>从 PowerContext 加载...</div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    const projectForm = document.getElementById('project-form');
    const updateForm = document.getElementById('update-form');
    const projectListEl = document.getElementById('project-list');

    projectForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        name: document.getElementById('name').value.trim(),
        description: document.getElementById('description').value.trim(),
        goal: document.getElementById('goal').value.trim(),
      };
      try {
        await api('/projects', { method: 'POST', body: JSON.stringify(body) });
        showToast('项目已创建（PowerContext 已记忆）', 'success');
        projectForm.reset();
        loadProjects();
      } catch (e) {
        showToast('创建失败: ' + e.message, 'error');
      }
    });

    updateForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('update-name').value.trim();
      const body = {
        status: document.getElementById('update-status').value,
        notes: document.getElementById('update-notes').value.trim(),
      };
      try {
        await api(`/projects/${encodeURIComponent(name)}/update`, {
          method: 'POST',
          body: JSON.stringify(body),
        });
        showToast('项目状态已更新', 'success');
        updateForm.reset();
        loadProjects();
      } catch (e) {
        showToast('更新失败: ' + e.message, 'error');
      }
    });

    async function loadProjects() {
      projectListEl.innerHTML = '<div class="loading"><div class="spinner"></div>从 PowerContext 加载...</div>';
      try {
        const projects = await api('/projects');
        if (!projects || projects.length === 0) {
          projectListEl.innerHTML = '<div class="empty-state"><h3>暂无项目</h3><p>创建你的第一个科研项目，PowerContext 会记住它</p></div>';
          return;
        }
        projectListEl.innerHTML = projects.map(p => {
          const content = p.content || '';
          const statusMatch = content.match(/状态:\s*(active|paused|completed|进行中|暂停|已完成)/);
          let status = 'active';
          if (statusMatch) {
            const s = statusMatch[1];
            if (s === '暂停' || s === 'paused') status = 'paused';
            else if (s === '已完成' || s === 'completed') status = 'completed';
          }
          const statusLabels = { active: '进行中', paused: '暂停', completed: '已完成' };
          const nameMatch = content.match(/项目名称:\s*(.+)/);
          const name = nameMatch ? nameMatch[1].trim() : (p.key || '未命名项目');
          return `
            <div class="project-card">
              <h3>${name}</h3>
              <span class="project-status ${status}">${statusLabels[status]}</span>
              <p style="white-space: pre-wrap; font-size: 0.85rem;">${content}</p>
            </div>
          `;
        }).join('');
      } catch (e) {
        projectListEl.innerHTML = `<div class="empty-state"><h3>PowerContext 未连接</h3><p>${e.message}</p><p style="margin-top: 0.5rem;">请先启动 PowerContext 服务</p></div>`;
      }
    }

    loadProjects();
  </script>
</body>
</html>
