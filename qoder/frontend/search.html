<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语义搜索 - 实验记录本</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"/>
      </svg>
      实验记录本
    </a>
    <nav>
      <a href="index.html">首页</a>
      <a href="experiments.html">实验记录</a>
      <a href="search.html" class="active">语义搜索</a>
      <a href="projects.html">项目管理</a>
      <a href="compare.html">实验对比</a>
    </nav>
  </header>

  <main class="container">
    <div class="section-header">
      <h2>语义搜索</h2>
    </div>
    <p style="color: var(--text-light); margin-bottom: 1.5rem;">
      使用自然语言搜索实验记录。seekdb 向量检索会理解你的意图，找到最相关的实验。
    </p>

    <div class="search-box">
      <input type="text" id="search-input" placeholder="例如：哪些实验的准确率超过了90%？" autofocus>
      <button class="btn btn-primary" onclick="performSearch()">搜索</button>
    </div>

    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem;">
      <span style="font-size: 0.85rem; color: var(--text-light); line-height: 2;">试试：</span>
      <button class="btn btn-secondary btn-sm" onclick="quickSearch('learning rate 较小的实验')">learning rate 较小的实验</button>
      <button class="btn btn-secondary btn-sm" onclick="quickSearch('准确率高的实验')">准确率高的实验</button>
      <button class="btn btn-secondary btn-sm" onclick="quickSearch('失败的实验及原因')">失败的实验及原因</button>
      <button class="btn btn-secondary btn-sm" onclick="quickSearch('使用数据增强的实验')">使用数据增强的实验</button>
    </div>

    <div id="search-results" class="experiment-list"></div>
  </main>

  <script src="js/api.js"></script>
  <script>
    const searchInput = document.getElementById('search-input');
    const resultsEl = document.getElementById('search-results');

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') performSearch();
    });

    function quickSearch(query) {
      searchInput.value = query;
      performSearch();
    }

    async function performSearch() {
      const query = searchInput.value.trim();
      if (!query) return;

      resultsEl.innerHTML = '<div class="loading"><div class="spinner"></div>seekdb 检索中...</div>';

      try {
        const results = await api('/search', {
          method: 'POST',
          body: JSON.stringify({ query, limit: 20 }),
        });

        if (!results || results.length === 0) {
          resultsEl.innerHTML = '<div class="empty-state"><h3>未找到相关实验</h3><p>试试换个关键词，或先添加一些实验记录</p></div>';
          return;
        }

        resultsEl.innerHTML = `
          <p style="color: var(--text-light); font-size: 0.9rem; margin-bottom: 1rem;">
            找到 ${results.length} 条相关结果（基于 seekdb 向量检索）
          </p>
          ${results.map(exp => renderExperimentCard(exp, true)).join('')}
        `;
      } catch (e) {
        resultsEl.innerHTML = `<div class="empty-state"><h3>搜索失败</h3><p>${e.message}</p></div>`;
      }
    }
  </script>
</body>
</html>
